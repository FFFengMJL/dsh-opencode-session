name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package from tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      dsh_range: ${{ steps.version.outputs.dsh_range }}
      node_range: ${{ steps.version.outputs.node_range }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 12.16.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Assert tagged source and version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${REF_TYPE}" != "tag" ]; then
            echo "::error::release must be triggered by a tag, got ${REF_TYPE}"
            exit 1
          fi
          head=$(git rev-parse HEAD)
          if [ "${head}" != "${EVENT_SHA}" ]; then
            echo "::error::checked out ${head}, but tag ${REF_NAME} resolves to ${EVENT_SHA}"
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "v${version}" != "${REF_NAME}" ]; then
            echo "::error::tag ${REF_NAME} does not match package version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${EVENT_SHA}" >> "$GITHUB_OUTPUT"
          echo "dsh_range=$(node -p "require('./package.json').engines.dsh")" >> "$GITHUB_OUTPUT"
          echo "node_range=$(node -p "require('./package.json').engines.node")" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm release:pack

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dsh-opencode-session-package
          path: |
            .release/*.tgz
            .release/SHA256SUMS
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  publish:
    name: Create draft from this tag's package
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dsh-opencode-session-package
          path: release

      - name: Verify release assets
        working-directory: release
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(./*.tgz)
          checksums=(./SHA256SUMS)
          if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${checksums[0]}" ]; then
            echo "::error::expected exactly one tarball and SHA256SUMS"
            exit 1
          fi
          sha256sum -c SHA256SUMS

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
          EXPECTED_SHA: ${{ needs.package.outputs.commit }}
          DSH_RANGE: ${{ needs.package.outputs.dsh_range }}
          NODE_RANGE: ${{ needs.package.outputs.node_range }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_SHA}" ]; then
            echo "::error::package job did not publish the tagged commit"
            exit 1
          fi
          if [ -z "${DSH_RANGE}" ] || [ -z "${NODE_RANGE}" ]; then
            echo "::error::package job did not report the supported runtime ranges"
            exit 1
          fi
          remote_sha=$(gh api "repos/${REPO}/commits/${TAG}" --jq .sha)
          if [ "${remote_sha}" != "${EXPECTED_SHA}" ]; then
            echo "::error::tag ${TAG} now resolves to ${remote_sha}, expected ${EXPECTED_SHA}"
            exit 1
          fi
          shopt -s nullglob
          tarballs=(release/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one tarball"
            exit 1
          fi
          asset=$(basename "${tarballs[0]}")
          url="https://github.com/${REPO}/releases/download/${TAG}/${asset}"
          {
            echo "dsh-opencode-session ${VERSION}"
            echo
            echo "首个公开版本：为自定义 OpenCode Go 路由注入每会话稳定的 \`x-opencode-session\`。"
            echo
            echo "Requires DSH ${DSH_RANGE} and Node.js ${NODE_RANGE}."
            echo "This project is MIT licensed and is intentionally not published to npm."
            echo
            echo "安装前校验："
            echo
            echo '```sh'
            echo "curl -fLO ${url}"
            echo "curl -fLO ${url%/*}/SHA256SUMS"
            echo "sha256sum -c SHA256SUMS"
            echo "dsh plugin --profile web add ./${asset}"
            echo '```'
            echo
            echo "完整说明见仓库 README。"
          } > notes.md
          gh release create "${TAG}" "${tarballs[0]}" release/SHA256SUMS \
            --draft --verify-tag --title "${TAG}" --notes-file notes.md --repo "${REPO}"
